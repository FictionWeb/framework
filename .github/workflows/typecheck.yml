name: Typecheck & deploy to pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  main:
    name: Check main file
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash_docker_image:
          - "bash:latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check 
        working-directory: .
        run: |
          bash -n fiction.so.sh
  build:
    name: Build example page
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash_docker_image:
          - "bash:latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Fiction Pages
        working-directory: .
        run: |
          bash fiction.so.sh build
          cd fiction_compiled && mv static.html index.html
      - name: Upload pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: fiction_compiled/
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Download pages artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: fiction_compiled/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fiction_compiled/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4